name: Scan and push

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan and push to Cloudflare
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/scan-and-push.mjs
